version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - revive
    - contextcheck
    - noctx
    - errorlint
  settings:
    revive:
      rules:
        - name: exported

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
