# SteerSpec configuration
# Reference: https://github.com/SteerSpec/strspc-CLI#readme

# Rule sources — where to fetch rules from
rules:
  # Core rules from the SteerSpec specification
  - source: github://SteerSpec/strspc-rules@v1.25.0/rules/core
    scope: global

  # This repository's own rules (dev.steerspec.manager realm). They govern
  # the Go sources, so the scope is global: "local" would limit them to
  # files under rules/ itself.
  - source: ./rules/
    scope: global

  # Local rules (uncomment after strspc realm init)
  # - source: ./rules/
  #   scope: local

# AI evaluator settings
evaluator:
  provider: claude          # requires ANTHROPIC_API_KEY; use "null" to skip AI evaluation
  # Haiku is the provider default from this release on. CI runs the released
  # CLI, so the model stays explicit until a CLI release carries the default.
  # Benchmarked on 2026-11-09 (src/ruleeval/claude/bench_test.go): as accurate
  # as claude-sonnet-5-5 on the labelled cases at medium effort, about 18x
  # cheaper per run; high effort added false violations and xhigh hit the
  # output cap.
  model: claude-haiku-5-5
  # effort: medium             # low | medium | high

# Local cache settings
cache:
  ttl: 24h                # how long cached evaluations stay valid

# Which rule states cause a failure (state codes: D, A, P, I, R, T)
fail_on:
  - I                     # Implemented rules block merges when violated
  # - P                   # uncomment to also enforce Published rules

# Which rule states are sent to the AI evaluator (default: D, P, I)
# evaluate_on: [D, P, I]
