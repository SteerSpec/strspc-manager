name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # src/result/codes_lifecycle_test.go compares the diagnostic code
          # registry with the one at the latest release tag (MOD-003).
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          # `config verify` downloads the JSON schema from golangci-lint.run
          # on every run and has timed out three times in one day (lint
          # itself never ran). The config is verified locally by `make lint`.
          verify: false

  # Dogfood: the released CLI validates this repository's realm (rules/)
  # and evaluates the change through the org reusable workflows
  # (SteerSpec/.github). Without ANTHROPIC_API_KEY the check is static-only.
  # Rule lifecycle moves one step per PR into develop. A release (the
  # same-repository develop -> main PR, and the resulting push to main)
  # aggregates those steps, which rulediff reads as skipped states (RD003), so
  # exactly those are exempt from the diff; any other PR into main is checked.
  rules:
    uses: SteerSpec/.github/.github/workflows/strspc-lint.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      path: rules/
      diff: >-
        ${{ !(
          (
            github.event_name == 'pull_request'
            && github.base_ref == 'main'
            && github.head_ref == 'develop'
            && github.event.pull_request.head.repo.full_name == github.repository
          )
          || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        ) }}

  check:
    uses: SteerSpec/.github/.github/workflows/strspc-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  lint-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: raven-actions/actionlint@v2
      - name: editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v2
