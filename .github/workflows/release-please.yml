name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App token
        # steerspec-sync App: its PRs trigger CI and auto-approve (unlike GITHUB_TOKEN),
        # its API commits are GitHub-signed (enterprise required_signatures) and its
        # author steerspec-sync[bot] is not the approving bot, so auto-approve can act.
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.STEERSPEC_APP_ID }}
          private-key: ${{ secrets.STEERSPEC_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          # Not GITHUB_TOKEN: its tag pushes would not trigger the GoReleaser
          # workflow and its PRs get no CI. Not a PAT either: PAT commits are unsigned.
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
